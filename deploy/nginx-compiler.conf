# nginx reverse-proxy config for the Arduino compile server.
#
# WHY THIS EXISTS
# ---------------
# The compile server is a Go service (container, port 8080) fronted by the
# system nginx on the VPS. A trivial sketch (blink) compiles in a second or
# two, but a first-time library compile (e.g. an I2C LCD/OLED sketch pulling in
# Wire + LiquidCrystal_I2C) is much heavier and can run for tens of seconds.
#
# nginx's DEFAULT proxy_read_timeout is 60s. If a compile runs longer than the
# proxy's timeout — or if the upstream is briefly down (restart / OOM / a
# provisioning window after a redeploy) — nginx returns 502/504 and the editor
# shows "Invalid response from compile server". The fix is to give the proxy
# timeouts that comfortably exceed the server's COMPILE_TIMEOUT (180s in
# docker-compose.yml) and to forward the real client IP.
#
# APPLY
# -----
#   sudo cp deploy/nginx-compiler.conf /etc/nginx/sites-available/arduino-compiler
#   sudo ln -sf /etc/nginx/sites-available/arduino-compiler /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust server_name, the TLS cert paths, and the upstream port to match your
# deployment. If you terminate TLS elsewhere (Cloudflare, a load balancer),
# keep the proxy_* timeout directives — they are the part that actually fixes
# the 502 on slow compiles.

upstream arduino_compiler {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name compile.example.com;  # <-- change me

    # --- TLS (point these at your real certs) ---
    ssl_certificate     /etc/letsencrypt/live/compile.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/compile.example.com/privkey.pem;

    # A compiled .hex is small, but the request body (sketch source) is capped
    # server-side at 1 MB — match it here so nginx rejects oversize bodies early.
    client_max_body_size 2m;

    location / {
        proxy_pass http://arduino_compiler;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Forward the real client IP (the server uses it for rate limiting when
        # TRUST_PROXY=true).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- THE IMPORTANT PART ---
        # A cold library compile can take well over nginx's default 60s. These
        # must exceed the server's COMPILE_TIMEOUT (180s) so the Go service gets
        # to return its own clean JSON error/result instead of nginx cutting the
        # connection and emitting a 502/504.
        proxy_connect_timeout 10s;
        proxy_send_timeout    200s;
        proxy_read_timeout    200s;

        # Don't silently retry a long POST against another upstream on error.
        proxy_next_upstream off;
    }
}

# Optional: redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name compile.example.com;  # <-- change me
    return 301 https://$host$request_uri;
}
