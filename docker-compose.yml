# =============================================================================
# Arduino Compiler API — Docker Compose Configuration
# =============================================================================
#
# Usage:
#   docker compose up --build        # Build and start the server
#   docker compose up -d             # Start in detached mode
#   docker compose logs -f           # View logs
#   docker compose down              # Stop and remove containers
#
# The server will be available at http://localhost:8080
#
# Test with:
#   curl http://localhost:8080/health
#   curl http://localhost:8080/api/boards
#   curl -X POST http://localhost:8080/api/compile \
#     -H "Content-Type: application/json" \
#     -d '{"code":"void setup(){} void loop(){}","board":"arduino:avr:uno"}' \
#     --output sketch.hex
# =============================================================================

services:
  arduino-compiler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arduino-compiler
    ports:
      - "8080:8080"

    # Persist the arduino-cli data dir (board cores + libraries) on a named
    # volume. Cores are downloaded here once on first start instead of being
    # baked into the image — that's what keeps the image small and stops the
    # build running out of disk. The volume survives `down`/rebuilds, so the
    # multi-GB download only ever happens once.
    volumes:
      - arduino_data:/home/appuser/.arduino15

    environment:
      # Server port (must match the port mapping above).
      - PORT=8080

      # Maximum number of simultaneous compilations.
      # Keep low on resource-constrained VPS (1GB RAM).
      - MAX_CONCURRENT_COMPILATIONS=1

      # Per-compilation timeout in seconds.
      # ESP32 compilations can be slow on low-resource VPS; 180s is safe.
      - COMPILE_TIMEOUT=180

      # Rate limit: max requests per minute per IP address.
      - RATE_LIMIT_RPM=10

      # Maximum request body size in bytes (1 MB).
      - MAX_REQUEST_SIZE=1048576

      # CORS: comma-separated list of allowed origins, or "*" for all.
      - ALLOWED_ORIGINS=*

      # Trust proxy headers (X-Forwarded-For, X-Real-IP) for client IP detection.
      # Set to "true" when behind a reverse proxy (nginx, Cloudflare, etc.).
      # Default: false (uses direct TCP connection address).
      - TRUST_PROXY=false
    restart: unless-stopped

    # Resource limits tuned for a 1GB RAM VPS.
    # The OS and Docker daemon need ~200-300MB, leaving ~700-800MB for the container.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.5"
          memory: 256M

    # Healthcheck is also defined in the Dockerfile, but can be overridden here.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First boot provisions cores into the volume (a multi-minute download)
      # before the server serves, so the start period is generous. Later
      # boots reuse the volume and come up in seconds.
      start_period: 900s

    # Logging configuration to prevent unbounded log growth.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Named volume holding the arduino-cli data dir (cores + libraries). Lives on
# the host's docker volume storage, not in the image, so rebuilds are cheap
# and the cores download only once.
volumes:
  arduino_data:
